<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recipe Analyzer - Minecraft Java Edition 合成分析</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <h1>合成表分析器 <span class="badge">Java Edition · 多版本</span></h1>
      <p class="sub">上传 mod jar/zip，自动解析配方、提取图标、渲染 3x3 合成表并分类。</p>
    </div>
  </header>

  <main class="layout">
    <section class="panel upload-panel">
      <h2>1. 上传 Mod</h2>
      <form id="uploadForm">
        <label class="field">Mod 文件
          <input id="modFile" type="file" name="mod" accept=".jar,.zip" required />
        </label>
        <label class="field">Minecraft 版本
          <select id="mcVersion" name="mcVersion"></select>
        </label>
        <label class="field">Vanilla jar（可选，图标回退）
          <input id="vanillaJar" type="text" name="vanillaJar" placeholder="留空自动检测；也可填绝对路径" />
        </label>
        <div id="vanillaStatus" class="status small">检测 vanilla jar...</div>
        <label class="checkbox-label">
          <input id="includeVanillaEquivalents" type="checkbox" name="includeVanillaEquivalents" />
          显示等价原版（c/forge 标签回退，默认严格按 mod 数据）
        </label>
        <button type="submit">分析</button>
      </form>
      <div id="status" class="status">等待上传...</div>
      <div id="summary" class="summary"></div>
    </section>

    <section class="panel filters-panel">
      <h2>2. 筛选</h2>
      <div class="filter-row">
        <label>分类
          <select id="categoryFilter"><option value="">全部</option></select>
        </label>
        <label>获取方式
          <select id="acqFilter">
            <option value="">全部</option>
            <option value="recipe">配方</option>
            <option value="advancement">成就获取（无配方）</option>
          </select>
        </label>
        <label>搜索
          <input id="searchInput" placeholder="产物名 / id / 类型" />
        </label>
      </div>
      <div id="categoryStats" class="category-stats"></div>
    </section>

    <section class="panel results-panel">
      <h2>3. 配方</h2>
      <div id="results" class="results"></div>
    </section>
  </main>

  <template id="recipeTpl">
    <article class="recipe-card">
      <div class="recipe-head">
        <div class="result-slot"></div>
        <div class="meta">
          <div class="result-name"></div>
          <div class="result-id"></div>
          <div class="tags"></div>
        </div>
      </div>
      <div class="crafting">
        <div class="grid"></div>
        <div class="arrow">→</div>
        <div class="out"></div>
      </div>
      <details class="source">
        <summary>来源</summary>
        <div class="source-path"></div>
      </details>
    </article>
  </template>

  <script src="/app.js" type="module"></script>
</body>
</html>
